<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050506">
  <title>Takitro Coming Soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050506'/%3E%3Cpath d='M16 19h32v8H36v21h-8V27H16z' fill='%2367f78f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://prod.spline.design">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050506;
      --panel: rgba(12, 13, 12, .72);
      --line: rgba(246, 243, 236, .18);
      --text: #f6f3ec;
      --muted: #a9aaa4;
      --green: #67f78f;
      --coral: #ff7a59;
      --blue: #8ac4ff;
      --look-x: 0;
      --look-y: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      isolation: isolate;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, .028) 1px, transparent 1px),
        linear-gradient(135deg, rgba(103, 247, 143, .08), transparent 34%, rgba(255, 122, 89, .07) 68%, transparent);
      background-size: 64px 64px, 64px 64px, auto;
    }

    .page::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(180deg, rgba(5, 5, 6, .4), transparent 26%, rgba(5, 5, 6, .82)),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .025), rgba(255, 255, 255, .025) 1px, transparent 1px, transparent 5px);
    }

    .robot-stage {
      position: absolute;
      inset: -5vh -4vw;
      z-index: 0;
      display: grid;
      place-items: center;
      pointer-events: auto;
    }

    spline-viewer {
      width: 108vw;
      height: 110vh;
      min-width: 820px;
      display: block;
      filter: contrast(1.04) saturate(1.08);
      transform:
        translate3d(calc(var(--look-x) * -14px), calc(var(--look-y) * -10px), 0)
        rotateX(calc(var(--look-y) * -1.2deg))
        rotateY(calc(var(--look-x) * 1.6deg));
      transition: transform 110ms ease-out, opacity 220ms ease-out;
    }

    .shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(18px, 3vw, 40px);
      pointer-events: none;
    }

    .topbar,
    .countdown {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      line-height: 1;
    }

    .brand-logo {
      width: clamp(126px, 15vw, 184px);
      height: auto;
      display: block;
      filter: drop-shadow(0 0 16px rgba(103, 247, 143, .14));
    }

    .date {
      max-width: 48vw;
      color: var(--muted);
      font-size: clamp(12px, 1.35vw, 15px);
      text-align: right;
      line-height: 1.3;
    }

    .hero-copy {
      align-self: end;
      max-width: 760px;
      padding-bottom: clamp(88px, 15vh, 170px);
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(46px, 10vw, 142px);
      line-height: .86;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .subtitle {
      width: min(560px, 92vw);
      margin: 18px 0 0;
      color: rgba(246, 243, 236, .78);
      font-size: clamp(15px, 1.6vw, 21px);
      line-height: 1.45;
    }

    .countdown {
      align-items: end;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(76px, 118px));
      gap: 8px;
      pointer-events: none;
    }

    .time-box {
      min-height: 82px;
      padding: 12px 12px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(14px);
    }

    .time-box b {
      display: block;
      min-height: 38px;
      color: var(--text);
      font-size: clamp(30px, 4vw, 46px);
      line-height: .9;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .time-box span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      text-transform: uppercase;
    }

    .target {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(103, 247, 143, .9);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 8px rgba(103, 247, 143, .08), 0 0 28px rgba(103, 247, 143, .34);
      transition: left 65ms linear, top 65ms linear;
    }

    .target::before,
    .target::after {
      position: absolute;
      inset: 50% auto auto 50%;
      content: "";
      background: var(--green);
      transform: translate(-50%, -50%);
    }

    .target::before {
      width: 2px;
      height: 42px;
    }

    .target::after {
      width: 42px;
      height: 2px;
    }

    .nav-pad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(2, 42px);
      gap: 6px;
      pointer-events: auto;
    }

    .nav-pad button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: rgba(12, 13, 12, .74);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      backdrop-filter: blur(12px);
    }

    .nav-pad button:hover,
    .nav-pad button:focus-visible {
      border-color: rgba(103, 247, 143, .65);
      outline: 0;
      color: var(--green);
    }

    .nav-pad button:active {
      transform: translateY(1px);
    }

    .nav-up {
      grid-column: 2;
    }

    .nav-left {
      grid-column: 1;
      grid-row: 2;
    }

    .nav-down {
      grid-column: 2;
      grid-row: 2;
    }

    .nav-right {
      grid-column: 3;
      grid-row: 2;
    }

    .accent-line {
      position: absolute;
      left: clamp(18px, 3vw, 40px);
      right: clamp(18px, 3vw, 40px);
      bottom: clamp(118px, 16vh, 150px);
      z-index: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--green), transparent 44%, var(--coral), var(--blue));
      opacity: .68;
      pointer-events: none;
    }

    @media (max-width: 820px) {
      body {
        overflow: hidden;
      }

      .page {
        height: 100svh;
        min-height: 100svh;
        overflow: hidden;
      }

      .robot-stage {
        inset: -3svh -18vw -5svh -26vw;
      }

      spline-viewer {
        width: 128vw;
        height: 105svh;
        min-width: 560px;
        transform:
          translate3d(calc(var(--look-x) * -9px), calc(var(--look-y) * -8px), 0)
          rotateX(calc(var(--look-y) * -1deg))
          rotateY(calc(var(--look-x) * 1.1deg));
      }

      .shell {
        height: 100svh;
        min-height: 100svh;
        padding: max(14px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
      }

      .topbar {
        align-items: flex-start;
      }

      .brand-logo {
        width: 128px;
      }

      .date {
        max-width: 43vw;
      }

      .hero-copy {
        max-width: 96vw;
        padding-bottom: clamp(78px, 15svh, 126px);
      }

      .subtitle {
        max-width: 78vw;
      }

      .countdown {
        align-items: end;
        gap: 10px;
      }

      .timer {
        grid-template-columns: repeat(4, minmax(58px, 1fr));
        gap: 6px;
        width: min(100%, 390px);
      }

      .time-box {
        min-height: 64px;
        padding: 8px 8px 7px;
      }

      .time-box b {
        min-height: 28px;
        font-size: clamp(28px, 8vw, 38px);
      }

      .time-box span {
        margin-top: 6px;
        font-size: 9px;
      }

      .nav-pad {
        grid-template-columns: repeat(3, 36px);
        grid-template-rows: repeat(2, 36px);
        gap: 5px;
      }

      .nav-pad button {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }

      .accent-line {
        bottom: 88px;
      }
    }

    @media (max-width: 560px) {
      .hero-copy {
        padding-bottom: clamp(88px, 16svh, 122px);
      }

      h1 {
        max-width: 9ch;
      }

      .subtitle {
        max-width: 84vw;
      }

      .countdown {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 7px;
      }

      .timer {
        width: 100%;
      }

      .nav-pad {
        align-self: flex-end;
        margin-right: 2px;
      }
    }

    @media (max-width: 430px) and (max-height: 760px) {
      .brand-logo {
        width: 116px;
      }

      .date {
        font-size: 11px;
      }

      .hero-copy {
        padding-bottom: 86px;
      }

      h1 {
        font-size: 44px;
      }

      .subtitle {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.35;
      }

      .time-box {
        min-height: 58px;
      }

      .time-box b {
        min-height: 24px;
        font-size: 30px;
      }

      .nav-pad {
        grid-template-columns: repeat(3, 32px);
        grid-template-rows: repeat(2, 32px);
      }

      .nav-pad button {
        width: 32px;
        height: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body data-launch="2026-06-20T00:00:00+05:30">
  <main class="page" aria-label="Takitro coming soon">
    <div class="robot-stage" aria-hidden="true">
      <spline-viewer id="robot" url="https://prod.spline.design/AqtlWJlNbO-ZMkvz/scene.splinecode"></spline-viewer>
    </div>

    <div class="target" id="target" aria-hidden="true"></div>
    <div class="accent-line" aria-hidden="true"></div>

    <section class="shell">
      <div class="topbar">
        <div class="brand">
          <img class="brand-logo" src="logo.svg" alt="Takitro">
        </div>
        <div class="date" id="launchLabel">Launching 20 Jun 2026</div>
      </div>

      <div class="hero-copy">
        <h1>Coming Soon</h1>
        <p class="subtitle">Good things take time. We are building a fully online experience for you.</p>
      </div>

      <div class="countdown" aria-live="polite">
        <div class="timer" role="timer" aria-label="Launch countdown">
          <div class="time-box">
            <b id="days">00</b>
            <span>Days</span>
          </div>
          <div class="time-box">
            <b id="hours">00</b>
            <span>Hours</span>
          </div>
          <div class="time-box">
            <b id="minutes">00</b>
            <span>Minutes</span>
          </div>
          <div class="time-box">
            <b id="seconds">00</b>
            <span>Seconds</span>
          </div>
        </div>

        <div class="nav-pad" aria-label="Move robot focus">
          <button class="nav-up" type="button" data-move="0,-1" title="Move up" aria-label="Move up">&uarr;</button>
          <button class="nav-left" type="button" data-move="-1,0" title="Move left" aria-label="Move left">&larr;</button>
          <button class="nav-down" type="button" data-move="0,1" title="Move down" aria-label="Move down">&darr;</button>
          <button class="nav-right" type="button" data-move="1,0" title="Move right" aria-label="Move right">&rarr;</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" async src="https://unpkg.com/@splinetool/viewer@1.3.5/build/spline-viewer.js"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const target = document.getElementById("target");
      const viewer = document.getElementById("robot");
      const output = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };

      const launchAt = new Date(document.body.dataset.launch);
      const state = { x: .5, y: .48, step: .07 };

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const pad = (value) => String(value).padStart(2, "0");

      function removeSplineBadge() {
        if (!viewer || !viewer.shadowRoot) return;

        const selectors = [
          "#logo",
          "a[href*='spline']",
          "[title*='Spline' i]",
          "[aria-label*='Spline' i]"
        ];

        selectors.forEach((selector) => {
          try {
            viewer.shadowRoot.querySelectorAll(selector).forEach((node) => {
              const badge = node.closest("a") || node;
              badge.remove();
            });
          } catch (_) {}
        });
      }

      function watchSplineBadge() {
        removeSplineBadge();
        if (!viewer || !viewer.shadowRoot || viewer.dataset.badgeWatcher === "active") return;

        viewer.dataset.badgeWatcher = "active";
        new MutationObserver(removeSplineBadge).observe(viewer.shadowRoot, {
          childList: true,
          subtree: true
        });
      }

      function setLook() {
        const px = state.x * window.innerWidth;
        const py = state.y * window.innerHeight;
        const lookX = (state.x - .5) * 2;
        const lookY = (state.y - .5) * 2;

        target.style.left = `${px}px`;
        target.style.top = `${py}px`;
        root.style.setProperty("--look-x", lookX.toFixed(3));
        root.style.setProperty("--look-y", lookY.toFixed(3));
        sendRobotPointer(px, py);
      }

      function sendRobotPointer(clientX, clientY) {
        if (!viewer) return;

        const base = {
          bubbles: true,
          composed: true,
          cancelable: true,
          clientX,
          clientY,
          screenX: clientX,
          screenY: clientY,
          pointerId: 1,
          pointerType: "mouse",
          isPrimary: true
        };

        try {
          const canvas = viewer.shadowRoot && viewer.shadowRoot.querySelector("canvas");
          const targetNode = canvas || viewer;
          targetNode.dispatchEvent(new PointerEvent("pointermove", base));
          targetNode.dispatchEvent(new MouseEvent("mousemove", base));
        } catch (_) {}

        try {
          const app = viewer.spline || viewer.scene || null;
          if (app && typeof app.setVariable === "function") {
            app.setVariable("cursorX", state.x);
            app.setVariable("cursorY", state.y);
          }
        } catch (_) {}
      }

      function moveBy(dx, dy) {
        state.x = clamp(state.x + dx * state.step, .04, .96);
        state.y = clamp(state.y + dy * state.step, .06, .94);
        setLook();
      }

      function moveTo(clientX, clientY) {
        state.x = clamp(clientX / window.innerWidth, .04, .96);
        state.y = clamp(clientY / window.innerHeight, .06, .94);
        setLook();
      }

      function updateCountdown() {
        let diff = launchAt.getTime() - Date.now();
        if (!Number.isFinite(diff) || diff < 0) diff = 0;

        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        output.days.textContent = pad(days);
        output.hours.textContent = pad(hours);
        output.minutes.textContent = pad(minutes);
        output.seconds.textContent = pad(seconds);
      }

      let frame = 0;
      window.addEventListener("pointermove", (event) => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => moveTo(event.clientX, event.clientY));
      }, { passive: true });

      window.addEventListener("keydown", (event) => {
        const keys = {
          ArrowUp: [0, -1],
          ArrowDown: [0, 1],
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0]
        };

        const vector = keys[event.key];
        if (!vector) return;
        event.preventDefault();
        moveBy(vector[0], vector[1]);
      }, { passive: false });

      document.querySelectorAll("[data-move]").forEach((button) => {
        button.addEventListener("click", () => {
          const [dx, dy] = button.dataset.move.split(",").map(Number);
          moveBy(dx, dy);
        });
      });

      window.addEventListener("resize", setLook, { passive: true });
      if (viewer) {
        viewer.addEventListener("load", () => {
          setLook();
          watchSplineBadge();
        });

        const badgeCheck = setInterval(watchSplineBadge, 250);
        setTimeout(() => clearInterval(badgeCheck), 8000);
      }

      setLook();
      watchSplineBadge();
      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
